name: Build IPA

# Builds Madeira.app for iOS and packages Payload/Madeira.app into an IPA.
#
# This file also carries the fork's host checks: ten scripts under
# tests/host/ assert that their own check is wired into this workflow, so the
# step names and the shell fragments below are load-bearing. tests/host/
# check-vcruntime-mfc.py parses this file structurally and slices sections on
# the literal "\n      - name:", so every step item is indented six spaces.
#
# Everything here follows docs/BUILDING.md; the steps it marks UNVERIFIED are
# the ones most likely to fail first.

on:
  workflow_dispatch:
    inputs:
      rebuild_llvm:
        description: Rebuild LLVM for iOS instead of restoring it from cache (takes hours)
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ipa.yml'

# Runs queue rather than cancel: a cancelled run throws away stages it already
# built, and the stage cache is saved only when a run reaches its save step.
concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: false

env:
  # Xcode 16.4 is the default on macos-15 and carries the iOS 18 SDK; the app's
  # deployment target is 17.0 (project.pbxproj:937).
  XCODE_APP: /Applications/Xcode_16.4.app
  LLVM_MINGW_VER: '20260421'
  LLVM_MINGW_SHA: bd85a3975723815cef28dbbd2ca2cb0c926f6b348a12a0453f39f7af273cb3f7
  LLVM_COMMIT: 8dfdcc7b7

jobs:
  # The host checks are fast and independent of the app build, so they land a
  # result in minutes while the build job is still compiling.
  checks:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install extraction tools
        run: brew install sevenzip

      - name: Fetch the VC++ runtime DLLs from Microsoft
        shell: bash
        run: |
          set -euo pipefail
          WANT="concrt140.dll msvcp140.dll msvcp140_1.dll msvcp140_2.dll msvcp140_atomic_wait.dll msvcp140_codecvt_ids.dll vcamp140.dll vccorlib140.dll vcomp140.dll vcruntime140.dll vcruntime140_1.dll vcruntime140_threads.dll mfc140.dll mfc140u.dll"
          NWANT=$(echo $WANT | wc -w | tr -d ' ')
          DEST="app/Madeira/x86_64-vcruntime"
          URL="https://aka.ms/vs/17/release/vc_redist.x64.exe"
          TMP="$(mktemp -d "${TMPDIR:-/tmp}/madeira-vcrt.XXXXXX" 2>/dev/null || mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          mkdir -p "$DEST" "$TMP/stage" "$TMP/cabs"
          echo "fetching the redistributable..."
          curl --proto '=https' --tlsv1.2 -fL --retry 3 -o "$TMP/VC_redist.x64.exe" "$URL"
          SEVENZIP=""
          if command -v 7zz >/dev/null 2>&1; then
            SEVENZIP="7zz"
          elif command -v 7z >/dev/null 2>&1; then
            SEVENZIP="7z"
          else
            echo "error: 7zz or 7z not found (brew install sevenzip)" >&2
            exit 1
          fi
          # The redistributable is a Burn bundle: one CAB is appended after the
          # bootstrapper's own archive, and that payload CAB holds further CABs
          # (one for the C++ runtime, one for MFC). 7-Zip only unpacks the
          # bootstrapper, so carve every embedded MSCF blob by the cbCabinet
          # length in its header, then unpack whatever cabinets fall out.
          grep -boa "MSCF" "$TMP/VC_redist.x64.exe" | cut -d: -f1 | while IFS= read -r off; do
            size=$(od -An -tu4 -j $((off + 8)) -N 4 "$TMP/VC_redist.x64.exe" | tr -d ' ')
            [ -n "$size" ] && [ "$size" -gt 0 ] || continue
            # tail never sees SIGPIPE from head here: write, then cut to length.
            tail -c +$((off + 1)) "$TMP/VC_redist.x64.exe" > "$TMP/cabs/cab$off.cab"
            truncate -s "$size" "$TMP/cabs/cab$off.cab"
          done
          for f in "$TMP/cabs"/*; do
            [ -f "$f" ] || continue
            "$SEVENZIP" x "$f" -o"$TMP/l0_$(basename "$f" .cab)" -y >/dev/null 2>&1 || true
          done
          for dir in "$TMP"/l0_*; do
            [ -d "$dir" ] || continue
            for f in "$dir"/*; do
              [ "$(head -c 4 "$f" 2>/dev/null | tr -d '\0')" = "MSCF" ] || continue
              "$SEVENZIP" x "$f" -o"$TMP/l1_$(basename "$f" .cab)" -y >/dev/null 2>&1 || true
            done
          done
          for dir in "$TMP"/l1_*; do
            [ -d "$dir" ] || continue
            for f in "$dir"/*; do
              [ "$(head -c 4 "$f" 2>/dev/null | tr -d '\0')" = "MSCF" ] || continue
              "$SEVENZIP" x "$f" -o"$TMP/l2_$(basename "$f" .cab)" -y >/dev/null 2>&1 || true
            done
          done
          # A CAB can carry both the amd64 and the arm64 payload; take the
          # machine the games run on and leave the arm64 one.
          is_x64() { python3 -c 'import struct,sys; d=open(sys.argv[1],"rb").read(1024); sys.exit(0 if d[:2]==b"MZ" and struct.unpack_from("<H", d, struct.unpack_from("<I", d, 0x3c)[0] + 4)[0] == 0x8664 else 1)' "$1" 2>/dev/null; }
          FOUND=0
          for name in $WANT; do
            base="${name%.dll}"
            match=""
            while IFS= read -r -d '' f; do
              if is_x64 "$f"; then
                match="$f"
                break
              fi
            done < <(find "$TMP" -type f \( -iname "$name*" -o -iname "F_CENTRAL_${base}_*" \) -print0)
            if [ -n "$match" ]; then
              cp "$match" "$TMP/stage/$name"
              FOUND=$((FOUND + 1))
            else
              echo "warn: $name not found in the redistributable" >&2
            fi
            [ "$FOUND" -eq "$NWANT" ] && break
          done
          cp "$TMP/stage/"*.dll "$DEST/"
          echo "recovered $FOUND of $NWANT"

      - name: Report vcruntime contents
        shell: bash
        run: |
          set -euo pipefail
          N=$(find app/Madeira/x86_64-vcruntime -maxdepth 1 -name '*.dll' | wc -l | tr -d ' ')
          echo "vcruntime DLLs: $N of 14"
          if [ "$N" -lt 14 ]; then
            echo "error: expected fourteen files in app/Madeira/x86_64-vcruntime" >&2
            ls -l app/Madeira/x86_64-vcruntime >&2 || true
            exit 1
          fi

      - name: Check eco-native
        run: python3 tests/host/check-eco-native.py

      - name: Check lean-diag
        run: python3 tests/host/check-lean-diag.py

      - name: Check msc-unbounded-retry
        run: python3 tests/host/check-msc-unbounded-retry.py

      - name: Check power-probe
        run: python3 tests/host/check-power-probe.py

      - name: Check quiet-log
        run: python3 tests/host/check-quiet-log.py

      - name: Check srv-direct
        run: python3 tests/host/check-srv-direct.py

      - name: Check srv-eco-follow
        run: python3 tests/host/check-srv-eco-follow.py

      - name: Check srv-fd-reply
        run: python3 tests/host/check-srv-fd-reply.py

      - name: Check vcruntime-mfc
        run: python3 tests/host/check-vcruntime-mfc.py

      - name: Check x64-image-nocopy
        run: python3 tests/host/check-x64-image-nocopy.py

  build:
    runs-on: macos-26
    timeout-minutes: 360
    needs: checks
    steps:
      # The driver fetches submodules itself, only for the stages that rebuild, so
      # checkout takes none.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Select Xcode
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] && sudo xcode-select -s "$X"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Tools
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install bash zstd ldid xcbeautify

      # One cache for every stage's outputs (ci/build-all.sh keys each stage itself). The
      # newest entry is restored; a run saves a new one only when a stage was rebuilt.
      - name: Restore stage cache
        uses: actions/cache/restore@v4
        with:
          path: .stage-cache
          key: stages-${{ github.run_id }}
          restore-keys: stages-

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-${{ github.run_id }}
          restore-keys: ccache-

      - name: Build
        env:
          LOGS: ${{ github.workspace }}/ci-logs
          OUT: ${{ github.workspace }}/ci-out
          CACHE: ${{ github.workspace }}/.stage-cache
        run: |
          "$(brew --prefix)/bin/bash" ci/build-all.sh

      - name: Save stage cache
        if: always() && hashFiles('.stage-cache/changed.marker') != ''
        uses: actions/cache/save@v4
        with:
          path: .stage-cache
          key: stages-${{ github.run_id }}

      - name: Save ccache
        if: always() && hashFiles('.stage-cache/changed.marker') != ''
        uses: actions/cache/save@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-${{ github.run_id }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: ci-logs

      - name: Upload IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: ci-out/*.ipa
          if-no-files-found: ignore
